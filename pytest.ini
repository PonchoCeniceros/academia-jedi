[pytest]
# Quitamos -s y añadimos configuración de logs.
# --import-mode=importlib permite que varios trials tengan un main.py sin
# colisionar (con el modo por defecto, 241/, 338/ y 746/ chocaban con
# "import file mismatch" porque comparten el basename `main`).
addopts = --tb=no -q --import-mode=importlib
log_cli = true
log_cli_level = INFO
log_cli_format = %(message)s

# Indica que python/ debe añadirse al PYTHONPATH (para que `utils` sea importable)
pythonpath = python
# Directorio donde pytest buscará los tests por defecto
testpaths = python/trials
# Patrones de archivos que pytest debe considerar como tests
python_files = *.py
